# ============================================================================
# dsh-mm-models bundle patch
# 规划：dsh-创作模式插件-规划.txt v0.7（[7] 最终架构 / [8.2] 配置样例）
#
# 两行（2026-10-17 起）：
#   行1  llm-pi-ai（覆盖配置）：providers.glm / providers.qwen-vl → 读图路由
#   行2  mm-models（自研）：ask_glm / ask_qwen（读图员）+ subagent_code /
#        subagent_research（窄委派）+ qwen_draw / seedance_video / video_gen /
#        media_task / media_report；子代理的 persona 与工具面在三个 preset-mm-* 里。
#
# ⚠ 四个子代理工具**都不再由 tool-subagent 行提供**：
#   - 读图员（2026-10-17）：那条路的 Config 没有 description，工具描述被拼死成与
#     `subagent` 逐字相同 —— 模型看不出 ask_glm 是读图。
#   - 窄委派（2026-10-18）：`agentPreset` 是装配期校验，而 preset 是激活期异步注册的，
#     首次热重载会报 "Unknown agent preset"（详见下面行2c/2d 的说明）。
#   现在都由插件用 ctx.subagents.startActivation() 自己注册（tools/reader.mjs、
#   tools/delegation.mjs），`agentPreset` 在调用时才解析。
#
# ⚠ 行1 是"覆盖"语义：config 整体替换，不会与已有 providers 深合并。
#    出厂模板假设 profile 的 llm-pi-ai 行没有 config（新装默认如此）。
#    若你的 profile 已有 providers（例如在 GUI 里添加过路由），
#    请把 providers.glm 合并进那份配置，或删掉本行后手工添加 GLM / Qwen-VL 路由。
#
# 实测（2026-10-12）：glm-4.6v-flash 持续 429（型号拥挤不可用）；
# glm-4.6v / glm-4.5v / glm-4v-flash 均可用，且"左红右蓝"读图测试全部答对。
# 这里保留 glm-4.6v（同族、较新）；flash 恢复后改回下面两处 id 即可。
# ============================================================================

# ---- 行1：智谱 GLM 视觉路由（key 在 设置 → 模型 → GLM 行 填写）----
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      glm:
        displayName: GLM (智谱·视觉)
        apiKeyEnv: ZHIPU_API_KEY
        api: openai-completions
        baseURL: https://open.bigmodel.cn/api/paas/v4
        compat: { thinkingFormat: zai }
        models:
          # input 必须声明 image，否则图片会变成占位符（规划 [2.1] 前置条件）。
          - id: glm-4.6v
            input: [text, image]
            contextWindow: 200000
            maxTokens: 32768
          # 2026-10-17 加：读图员换到 glm-5.3-flash。
          # ⚠ 只改 tool-subagent-glm 的 agentOptions 是不够的 —— provider 的模型白名单
          # 不含这个 id 时，spawn 会直接报
          #   `pi-ai provider "glm" has no configured model "glm-5.3-flash"`
          # （实测踩到）。两处必须同时改：这里是"允不允许调"，下面是"读图员用哪个"。
          # 规格取自官方文档：上下文 1M，最大输出 128K，原生多模态（图像/视频/文本/文件）。
          - id: glm-5.3-flash
            input: [text, image]
            contextWindow: 1000000
            maxTokens: 128000
      # ask_qwen 用的百炼 Qwen-VL 路由（2026-10-12 实跑确证：qwen3-vl-plus 真读图）。
      qwen-vl:
        displayName: Qwen-VL (百炼·视觉)
        apiKeyEnv: DASHSCOPE_API_KEY
        api: openai-completions
        baseURL: https://dashscope.aliyuncs.com/compatible-mode/v1
        models:
          - id: qwen3-vl-plus
            input: [text, image]
            contextWindow: 131072
            maxTokens: 32768

# ---- 行2：读图员 preset（persona + 只有 read_image 的工具面）----
# 工具本身由 mm-models 注册（tools/reader.mjs）；这里只定义子代理"能看见什么"。
- insert:
    # ---- 读图/执行/资料三个子代理的 preset（2026-10-17 迁移）----
    #
    # ⚠ DSH **0.2.1** 起，`dsh-tool-subagent` 不再接受 persona / toolFilter /
    #   backgroundMode / enableRunInBackground。带着这些键加载会直接抛：
    #     "tool-subagent: persona is no longer supported; configure persona and tool
    #      plugins in an Agent Preset and select it with agentPreset (spawn only)"
    #   —— 这就是升级后 ask_glm / ask_qwen / subagent_code / subagent_research
    #   全部消失的原因。
    #
    # 新契约：子代理的 **persona 与工具面**都写进 preset 的 `plugins` 列表，
    # 工具行只用 `agentPreset` 引用它。preset 里**没列出的插件就没有对应工具**，
    # 所以"窄工具面"从运行时的 toolFilter 变成了装配期的物理事实。

    - id: preset-mm-reader
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mm-reader
        name: MM 读图员
        description: 只读图片、不做任何环境探查的视觉阅读员
        order: 91
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                你是视觉阅读员：只把图片、截图、图表、界面里的文字与结构转述成结论。
                不臆测、不补全看不见的内容；看不清就明确说看不清。
                除图片之外的一切请求（读代码、翻目录、查配置、跑命令）都超出你的能力：
                直接回答"这需要主代理处理"，不要尝试、不要重试。
                输出尽量短：先给结论，再给支撑细节。
          # 工具面 = 只有 read_image：read/write/edit 全关，读图开关打开。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: false
              write: false
              edit: false
              readImage: true

    - id: preset-mm-code
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mm-code
        name: MM 执行子代理
        description: 命令 + 文件读写 + 查找
        order: 92
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                你是执行子代理：只做交给你的那一件事，做完给结论与证据，不要扩大范围。
                你的工具面是刻意收窄的（命令 + 文件读写 + 查找）；需要别的能力就明确回答
                "这需要主代理处理"，不要绕道、不要反复试错。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              write: true
              edit: true
              readImage: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            # 2026-10-17 实测：这个键在 0.2.1 是**必填**（schema 无默认值），缺了会让
            # 整个 preset 激活失败 → subagent_code 一调用就报
            # "tool-fs-search: invalid config: $.sampleOverCapGlobResults missing required value"。
            config:
              sampleOverCapGlobResults: false
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

    - id: preset-mm-research
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mm-research
        name: MM 资料子代理
        description: 只读检索 + 联网取证
        order: 93
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                你是资料子代理：只做检索与取证，给出结论 + 来源链接。
                不要改动任何文件、不要跑命令；需要动手的活回答"这需要主代理处理"。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              write: false
              edit: false
              readImage: false
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'

    # ⚠ 2026-10-17：读图员两行（tool-subagent-glm / tool-subagent-qwen）已**删除**。
    #
    # 原因：`dsh-tool-subagent` 的 Config 是封闭的 7 键
    #   （provider / toolName / modelSelectionSettings / agentOptions /
    #     agentPreset / allowedAgentPresets / maxDepth），**没有 description**；
    #   工具描述由 providerWording() 拼死成与 `subagent` 逐字相同的文案 ——
    #   模型在 40+ 个工具里看不出 ask_glm 是"读图"。
    #
    # 现在：读图员由插件自己用 ctx.subagents.startActivation() 注册
    #   （见 tools/reader.mjs），描述与 schema 完全可控；子代理仍然走 preset-mm-reader。
    #   路由与深度改由 mm-models 的 Config 决定：
    #   readerGlmProvider / readerGlmModel / readerQwenProvider / readerQwenModel /
    #   readerAgentPreset / readerMaxDepth。
    #
    # ⚠ 不要把这两行加回来：插件已注册同名工具，重复注册会冲突。

    # ---- 行2c/2d：窄委派行（2026-10-16 加；2026-10-17 迁到 preset；2026-10-18 删行）
    #
    # ⚠ 2026-10-18 事故：这两行（tool-subagent-code / tool-subagent-research）已**删除**。
    #
    # 现象：桌面端「插件页 → 启用 gpt-CN」触发首次热重载时，启动审计报
    #   dsh: warning: 2 entries did not activate
    #   tool-subagent-code (...): RemoteError: Unknown agent preset: mm-code
    #   tool-subagent-research (...): RemoteError: Unknown agent preset: mm-research
    # 而 preset-mm-code / preset-mm-research 本身没坏，读图员（同样引用 preset）照常可用。
    #
    # 根因（dsh-tool-subagent 0.2.1 源码）：`agentPreset` 是**装配期**校验的
    #   apply() → SubagentPresetSelection.validate() → agentPresets.readDocument(id)
    # 而 preset 的注册是**激活期**异步完成的
    #   Service.init → agentPresets.register(config)
    # 热重载时 recomposeProfile() 用 Promise.all 并发重启整棵树，新插入的 preset 行
    # 还没走到 register()，委派行已经在 apply() 里查 preset 了。冷启动时导入顺序恰好
    # 让 preset 先注册，所以本地/测试里看不出来 —— 只在"首次启用该 bundle"时现形。
    # 这不是配置写错，重试一次也能好，但下次启用还会犯。
    #
    # 修法：两条工具改由插件自己注册（tools/delegation.mjs），`agentPreset` 在
    # **调用时**才交给 subagents.startActivation()。装配期不再依赖 preset 是否已注册。
    # 深度与 preset 由 mm-models 的 Config 决定：
    #   codeAgentPreset / researchAgentPreset / delegationMaxDepth。
    #
    # ⚠ 不要把这两行加回来：插件已注册同名工具，重复注册会冲突。

    # ---- 行3：自研插件本体 ----
    #
    # ⚠ 这条 config 是**出厂模板**，键集合必须与 index.js 的 Config **完全一致**。
    #   tests/run.mjs 的「发布用 patch 与出厂 Config 对齐」用例会断言：不漏键、不多键、
    #   不含零价，且 seedanceModel / qwenModel 在单价表里有正价。
    #   2026-10-15 修：此前这份模板停留在"修复前"的值 —— seedanceModel 是**别名**而不是模型 id、
    #   单价全是 0.0、超时还是 10/30 分钟，并且缺了 15 个新键（含花费闸门）。
    #   后果不是"本机出问题"，而是**新装用户一出片就被 fail-closed 锁死 + 启动告警**，
    #   而作者本机的 profile 早已手改好，所以一直没暴露。
    - id: mm-models
      name: 'dsh-mm-models'
      config:
        # 三把 key：secret 字面值（null = 未设置）优先于 credential-ref 引用
        dashscopeApiKey: null
        dashscopeApiKeyEnv: DASHSCOPE_API_KEY
        arkApiKey: null
        arkApiKeyEnv: ARK_API_KEY
        zhipuApiKey: null
        zhipuApiKeyEnv: ZHIPU_API_KEY
        # 端点与型号
        dashscopeBase: https://dashscope.aliyuncs.com/api/v1
        dashscopeCompatBase: https://dashscope.aliyuncs.com/compatible-mode/v1
        arkBase: https://ark.cn-beijing.volces.com/api/v3
        # 百炼视频（可灵/万相）：域名是 {WorkspaceId}.cn-beijing.maas.aliyuncs.com，
        # 与上面的 dashscopeBase 不是同一个域；WorkspaceId 留空时 video_gen fail-closed。
        dashscopeWorkspaceId: ''
        dashscopeVideoBase: ''
        videoModel: kling/kling-v3-video-generation
        qwenModel: qwen-image-3.0
        # 实测（2026-10-12）：部分账号不具备 DashScope 异步调用权限（403），
        # qwen-image 走同步 multimodal-generation；auto 会按模型自动选择。
        dashscopeImageMode: auto
        # ⚠ 必须是方舟**真实可用的模型名或接入点 id**，不能写别名：
        #   `doubao-seedance-<代>-<档>-<日期>`，日期后缀猜不出来，最省事是去控制台复制。
        #   曾写 'seedance-2.0'（别名）→ 单价表查不到新模型 id 的价 → 闸门 fail-closed、
        #   出片彻底不可用且没有任何告警。换 id 时**必须同步改 pricing 的 key**。
        seedanceModel: doubao-seedance-2-5-260628
        # 任务层（这几个"等待上限"是同步阻塞的，按"够用但早失败"定：超时可用 media_task 找回）
        taskTimeoutMs: 180000
        videoTimeoutMs: 900000
        taskPollIntervalMs: 5000
        taskPollMaxIntervalMs: 10000
        httpTimeoutMs: 60000
        queryRetries: 2
        maxCallsPerTurn: 6
        # 距上次生成超过它即视为"新一轮"、连续计数清零；超限文案里的秒数由它算出。
        callBudgetIdleResetMs: 25000
        # ---- 花费闸门（2026-10-15 事故后加：22 个误建任务、账单 ¥195.97）----
        # 出片按次计费且提交即扣费，所以默认不是 0（不限）：放开限制必须是个显式动作。
        videoCostLimitCNY: 10
        videoSessionCostLimitCNY: 30
        requireSpendConfirm: true
        # 小额免确认（2026-10-16 加）：预估 ≤ 这个数就直接提交、不必复述金额。
        # 只跳过"复述金额"这一层，单次/会话上限与"未计价 fail-closed"照旧生效。
        # 默认 1 元：制图一批最多 4 张 = ¥0.72（免确认）；出片 1 秒 = ¥1.52（仍要确认）。
        # 0 = 关闭该机制，一律要确认。
        noConfirmUnderCNY: 1
        # fail-closed：查不到单价就拒绝提交，调用方无法用"自报金额"绕过闸门。
        allowUnpricedSpend: false
        # 生成类工具（qwen_draw / seedance_video）的**子代理刹车**（2026-10-16）。
        # 默认 false = **允许**子代理生成（用户策略：繁重任务里让子代理直接出图，效率优先）。
        # 设 true = 子代理只能把生成需求回报给主代理（适合无人值守跑重活时收紧）。
        # 配套：子代理的花费记在自己会话上，主代理的 cost(session) 现在按**会话树**汇总，
        # 会话累计上限也一并覆盖子会话 —— 允许生成不等于看不见/管不住。
        blockSubagentSpend: false
        # 只拦出片、不拦出图（2026-10-17 加）：子代理可用 qwen_draw 与读图员，
        # 但调不动 seedance_video / video_gen。默认 false；与上面的开关是"或"关系。
        blockSubagentVideoSpend: false
        # ---- 落盘 ----
        outDir: gen
        videoOutDir: gen/video
        maxDownloadBytes: 209715200
        maxInlineImageBytes: 10485760
        ledgerPath: ''
        # ---- 出图缓存（同样的 prompt + 参数不重复计费）----
        cacheResults: true
        cacheTtlMs: 86400000
        cacheKeySalt: ''
        maxCacheEntries: 200
        # ---- 单价表 ----
        # ⚠ `pricing` 是**整体替换**语义：写了它，出厂的 DEFAULT_PRICING 就完全不生效。
        # 规矩（index.js 的 schema description 里写着同一句）：
        #   - key **必须是真实模型 id**，不是简称（'seedance-2.0' 这种别名查不到价）；
        #   - 不知道价格写 null（= 未计价，报表会显式写「未计价」）；
        #   - **不要写 0** —— 0 等于宣称"免费"：闸门会按"未计价"处理并拒绝提交，
        #     报表也不会再把真钱显示成 0.0000（自检会在 media_report(health) 里点名）。
        # 价格会变，请按各厂商官网核对后自行更新；source 字段就是取价页面。
        pricing:
          qwen-image-3.0:
            unit: image
            unitPrice: 0.18
            currency: CNY
            asOf: 2026-10-13
            source: https://help.aliyun.com/zh/model-studio/qwen-image-3-0
          doubao-seedance-2-5-260628:
            unit: second
            unitPrice: 1.519
            currency: CNY
            asOf: 2026-10-15
            tiers: []
            source: '估算：21,700 tokens/秒（实测）× 70 元/百万 token（第三方来源，未经官方页核实）'
          doubao-seedance-2-0-fast-260128:
            unit: second
            unitPrice: 0.998
            currency: CNY
            asOf: 2026-10-15
            tiers: []
            source: '估算：21,700 tokens/秒（实测）× 46 元/百万 token（第三方来源，未经官方页核实）'
          doubao-seedance-1-0-pro-fast-251015:
            unit: second
            unitPrice: 0.206
            currency: CNY
            asOf: 2026-10-15
            tiers: []
            source: https://www.bianews.com/news/details?id=223817
          # ---- 百炼视频（2026-10-17）：可灵 v3 / 万相 2.5 ----
          # 按秒计价，档位 = 模式（720P/1080P/4K）× 是否带音频。
          # unitPrice 是兜底价（1080P 无声），实际取价走 tiers。
          kling/kling-v3-video-generation:
            unit: second
            unitPrice: 0.8
            currency: CNY
            asOf: 2026-10-17
            tiers:
              - { mode: std, audio: false, unitPrice: 0.6 }
              - { mode: std, audio: true, unitPrice: 0.9 }
              - { mode: pro, audio: false, unitPrice: 0.8 }
              - { mode: pro, audio: true, unitPrice: 1.2 }
              - { mode: 4k, audio: false, unitPrice: 3 }
              - { mode: 4k, audio: true, unitPrice: 3 }
            source: https://help.aliyun.com/zh/model-studio/kling-v3-video-generation
          kling/kling-v3-turbo-video-generation:
            unit: second
            unitPrice: 1
            currency: CNY
            asOf: 2026-10-17
            tiers:
              - { mode: std, audio: false, unitPrice: 0.8 }
              - { mode: std, audio: true, unitPrice: 0.8 }
              - { mode: pro, audio: false, unitPrice: 1 }
              - { mode: pro, audio: true, unitPrice: 1 }
            source: https://help.aliyun.com/zh/model-studio/kling-v3-turbo-video-generation
          kling/kling-v3-omni-video-generation:
            unit: second
            unitPrice: 0.8
            currency: CNY
            asOf: 2026-10-17
            tiers:
              - { mode: std, audio: false, unitPrice: 0.6 }
              - { mode: std, audio: true, unitPrice: 0.9 }
              - { mode: pro, audio: false, unitPrice: 0.8 }
              - { mode: pro, audio: true, unitPrice: 1.2 }
              - { mode: 4k, audio: false, unitPrice: 3 }
              - { mode: 4k, audio: true, unitPrice: 3 }
            source: https://help.aliyun.com/zh/model-studio/kling-v3-omni-video-generation
          wan2.5-t2v-preview:
            unit: second
            unitPrice: 1
            currency: CNY
            asOf: 2026-10-17
            tiers:
              - { mode: std, audio: false, unitPrice: 0.6 }
              - { mode: std, audio: true, unitPrice: 0.6 }
              - { mode: pro, audio: false, unitPrice: 1 }
              - { mode: pro, audio: true, unitPrice: 1 }
            source: https://help.aliyun.com/zh/model-studio/wan2-5-t2v
          glm-4.6v:
            unit: ktoken
            inputPrice: null
            outputPrice: null
            currency: CNY
            asOf: 2026-10-13
            source: https://bigmodel.cn/pricing
          qwen3-vl-plus:
            unit: ktoken
            inputPrice: null
            outputPrice: null
            currency: CNY
            asOf: 2026-10-13
            source: https://help.aliyun.com/zh/model-studio/model-pricing
        # ---- 任务注册表（整轮失败/超时后还能用 media_task 找回并补下载）----
        persistTasks: true
        taskRegistryPath: ''
        maxRegistryEntries: 200
        registryTtlMs: 604800000
        # 工具开关（插件页 → gpt-CN → 配置卡 一键勾选；关闭后调用被拒、新会话不显示）
        # 读图子代理 ask_glm / ask_qwen 互斥、必须二选一：设置卡里打开一个会自动关闭另一个；
        # 万一两个都是 true（例如手改本文件），Host 侧按 "GLM 优先" 仲裁并压制 ask_qwen，
        # media_report(action=health) 会把这次冲突标出来。
        # 2026-10-17 起出厂默认：ask_glm 开、原生读图屏蔽 —— 开箱即见插件效果，不用调。
        enableAskGlm: true
        enableAskQwen: false
        # 读图员路由（2026-10-17：工具由插件自己注册，这里是唯一事实源）。
        # ⚠ 模型 id 必须同时出现在上面 llm-pi-ai 的 providers.<provider>.models 里，
        #   否则 spawn 报 `pi-ai provider "glm" has no configured model "…"`（实测踩到）。
        readerGlmProvider: glm
        readerGlmModel: glm-5.3-flash
        readerQwenProvider: qwen-vl
        readerQwenModel: qwen3-vl-plus
        readerAgentPreset: mm-reader
        readerMaxDepth: 2
        # 窄委派（2026-10-18：同样由插件自己注册，preset 在调用时才解析）。
        # 工具面由 preset-mm-code / preset-mm-research 决定；这里只管 preset 与深度。
        codeAgentPreset: mm-code
        researchAgentPreset: mm-research
        delegationMaxDepth: 1
        # 屏蔽主代理的原生读图：打开后主 agent 的工具列表里没有 read_image，读图只能走
        # 上面选中的读图子代理。子代理不受影响 —— 否则读图员会被一起弄瞎（实测过）。
        # 2026-10-17 起默认开（开箱即用的确定性路由）；想用原生读图就把它和下面那个一起关掉。
        # 改这个开关需要完整重启才生效（限制在 agent 创建时装上）。
        blockMainAgentNativeVision: true
        # 屏蔽**通用子代理**的原生读图（2026-10-15 加；2026-10-17 起默认开）。
        # 原生子代理天生有 read_image，而插件的三条守卫只针对主代理 —— 繁重任务里
        # 子代理会自己读图，绕开读图员的只读契约。打开后除读图员外，子代理都拿不到 read_image。
        # ⚠ 前提：读图员开着，且 readerMaxDepth ≥ 2（本文件已是 2），否则子代理会失去看图途径。
        # 读图员豁免名单取自 Config 的 reader* 路由；认不出读图员时本开关对子代理不生效。
        blockSubagentNativeVision: true
        enableQwenDraw: true
        enableSeedanceVideo: false   # Ark 未开通/门槛高：默认关闭，接通后一键打开
        # 百炼出片（可灵/万相）：复用 DASHSCOPE_API_KEY，零新账号；但需先填业务空间 ID
        # 并在百炼控制台开通「可灵AI」模型卡片。默认关闭，接通后一键打开。
        enableVideoGen: false
        enableMediaTask: true
        enableMediaReport: true
        # ---- 生成物是否附回模型上下文 ----
        # 默认关（只回文件路径 + 规格）：qwen_draw 默认产 2048×2048 大图，
        # 塞回上下文会触发上传/传输失败而拖垮整轮，且多数路由本来就会降采样它。
        attachResultImages: false
        maxAttachImageBytes: 4194304
        # 其它
        promptSection: true
        degradeToText: false
        healthProbe: true
        healthProbeTtlMs: 300000
