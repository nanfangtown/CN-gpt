name: Bug 报告
description: 离线测试、真实 DSH、或某个工具的行为不符合预期
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢报告。**请先脱敏**：不要贴 API key、账单金额明细、完整会话日志或私人路径。
        安全漏洞请走私密渠道，见 SECURITY.md。

  - type: input
    id: versions
    attributes:
      label: 版本
      description: DSH 版本 + 插件版本（插件页或 package.json）
      placeholder: "DSH 0.2.1-rc.2 / dsh-mm-models 0.1.1"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
        - 其他
    validations:
      required: true

  - type: dropdown
    id: tool
    attributes:
      label: 相关工具 / 区域
      options:
        - ask_glm / ask_qwen（读图）
        - qwen_draw（制图）
        - seedance_video / video_gen（出片）
        - media_task（任务找回）
        - media_report（成本 / 健康）
        - subagent_code / subagent_research（窄委派）
        - 安装 / 配置卡 / 加载失败
        - 其他
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 实际行为 + 错误原文（请把 key / 账单 / 私人路径替换成 `<redacted>`）
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 你期望什么
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 安装 / 配置...
        2. 调用...
        3. 看到...
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断信息
      description: 可附 `media_report(action=health)` 的脱敏输出、`--dump-config` 的相关片段
      render: text
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已经脱敏，没有贴出任何可用密钥或账单明细
          required: true
        - label: 我已经搜索过现有 issue
          required: true
